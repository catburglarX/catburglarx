name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Colour contrast
        run: pnpm check:contrast

      - name: Build
        run: pnpm build
        env:
          # Read-only use: the contribution calendar is fetched at build time.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: JavaScript budget
        run: pnpm check:bundle

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests
        run: pnpm test

      - name: Résumé fits on one A4 page
        run: pnpm resume:pdf

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
